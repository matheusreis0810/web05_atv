<div class="row">
    <div class="card col-12 col-sm-12 col-md-4 col-lg-3 col-xl-2" *ngFor="let obj of lista">
        <b>{{obj.nome}}</b><br>
        <img src="{{obj.codigo}}.jpg" width="200px"><br>
        <p class="card-text" *ngIf="obj.valorPromo>0">
             de: <s>R$ {{obj.valor}}</s><br>
             por: R$ {{obj.valorPromo}}
        </p>
        <p class="card-text" *ngIf="obj.valorPromo<=0">
             por: R$ {{obj.valor}}
        </p>
        <button [routerLink]="['/detalhe', obj.codigo]" type="button" class="btn btn-info">Ver Detalhes</button>
        <button type="button" class="btn btn-success">Comprar</button>
    </div>
</div>
